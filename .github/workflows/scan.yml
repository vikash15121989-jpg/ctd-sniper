name: CTD Sniper Scanner Engine

on:
  schedule:
    # Roz Raat 8:00 PM IST ko Auto Run (UTC: 2:30 PM / 14:30)
    - cron: '30 14 * * 1-5'
  
  # Manual Run Button Ke Liye
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install pandas yfinance gspread numpy plotly
      - name: Run Python Scanner
        env:
          GSHEET_KEY: ${{ secrets.GSHEET_KEY }}
        run: python main.py
